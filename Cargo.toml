[workspace]
members = ["crates/*"]
exclude = ["fuzz", "vendor"]
resolver = "3"

[workspace.dependencies]
parley = { git = "https://github.com/linebender/parley", rev = "4f67747d3690bb21d25cc70b674ab0d269595759", features = ["complex-scripts"] }
# Parley's own fontique, for its features: Cargo shares a git dependency only between
# entries naming the same revision.
fontique = { git = "https://github.com/linebender/parley", rev = "4f67747d3690bb21d25cc70b674ab0d269595759" }
wgpu = "30.0.1"

[patch.crates-io]
sctk-adwaita = { path = "vendor/sctk-adwaita" }

# Shaping, rasterization and GPU submission stay optimised in debug builds, where
# unoptimised dependencies alone drop frames.
[profile.dev.package."*"]
opt-level = 3

# Tests replay thousands of commits and seals through the store, which unoptimised takes most
# of the suite's time.
[profile.test.package.onestore]
opt-level = 1
