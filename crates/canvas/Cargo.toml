[package]
name = "canvas"
version = "0.1.0"
edition = "2024"
publish = false

[features]
gpu = ["dep:bytemuck", "dep:swash", "dep:wgpu", "dep:image", "dep:roxmltree"]
# How a page responds to input and presents itself to assistive technology.
interaction = ["gpu", "dep:accesskit"]

[dependencies]
onestore = { path = "../onestore" }
parley.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
skrifa = "0.44.0"

bytemuck = { version = "1.25", features = ["derive"], optional = true }
swash = { version = "0.2.10", optional = true }
wgpu = { workspace = true, optional = true }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png"], optional = true }
roxmltree = { version = "0.21", optional = true }
accesskit = { version = "0.25.0", optional = true }

[[bin]]
name = "layout-probe"
path = "src/bin/layout_probe.rs"

[[bin]]
name = "page-probe"
path = "src/bin/page_probe.rs"

[dev-dependencies]
accesskit_consumer = "0.39.0"
pollster = "0.4"
png = "0.18"

[[example]]
name = "render_page"
required-features = ["gpu"]
