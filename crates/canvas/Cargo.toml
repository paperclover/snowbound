[package]
name = "canvas"
version = "0.1.0"
edition = "2024"
publish = false

[features]
gpu = ["draw/render", "dep:color_quant", "dep:image", "dep:png", "dep:resvg", "dep:sha2"]
# How a page responds to input and presents itself to assistive technology.
interaction = ["gpu", "dep:accesskit"]
# Pages printed as PDF, as OneNote prints them.
pdf = ["interaction", "draw/pdf"]

[dependencies]
draw = { path = "../draw", default-features = false }
onestore = { path = "../onestore" }
parley.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
icu_normalizer = "2.3"
skrifa = "0.44.0"
# std's clock where there is one; the browser's on wasm32-unknown-unknown, whose std has none.
web-time = "1.1"

accesskit = { version = "0.25.0", optional = true }
color_quant = { version = "1.1", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
png = { version = "0.18", optional = true }
resvg = { version = "0.48.1", default-features = false, optional = true }
sha2 = { version = "0.11", optional = true }

[[bin]]
name = "layout-probe"
path = "src/bin/layout_probe.rs"

[[bin]]
name = "page-probe"
path = "src/bin/page_probe.rs"

[dev-dependencies]
draw = { path = "../draw", features = ["wgpu"] }
miniz_oxide = "0.8"
accesskit_consumer = "0.39.0"
pollster = "0.4"
wgpu.workspace = true

[[example]]
name = "render_page"
required-features = ["gpu"]

[[example]]
name = "reading_inventory"
required-features = ["gpu"]

[[example]]
name = "print_pdf"
required-features = ["pdf"]
