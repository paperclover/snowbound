[package]
name = "mobile"
version = "0.1.0"
edition = "2024"
publish = false

# A C surface over a canvas page for native mobile shells; see resources/ios-port.md.
[lib]
crate-type = ["staticlib"]

[dependencies]
canvas = { path = "../canvas", features = ["interaction"] }
draw = { path = "../draw" }
notebook = { path = "../notebook", features = ["smb"] }
onestore = { path = "../onestore" }
wgpu.workspace = true
parley.workspace = true
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
