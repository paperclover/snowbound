[package]
name = "mobile"
version = "0.1.0"
edition = "2024"
publish = false

# A C surface over a canvas page for native mobile shells; see resources/ios-port.md.
[lib]
crate-type = ["staticlib"]

[dependencies]
canvas = { path = "../canvas", features = ["interaction", "pdf"] }
draw = { path = "../draw" }
notebook = { path = "../notebook", features = ["smb"] }
onestore = { path = "../onestore" }
wgpu.workspace = true
parley.workspace = true
pollster = "0.4"
resvg = { version = "0.48.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSRange", "NSString", "NSThread"] }

[dev-dependencies]
tempfile = "3"
