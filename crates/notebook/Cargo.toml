[package]
name = "notebook"
version = "0.1.0"
edition = "2024"
publish = false

[features]
smb = ["dep:smb2", "dep:tokio"]

[dependencies]
onestore = { path = "../onestore" }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.11"
smb2 = { version = "=0.21.0", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time"], optional = true }
zeroize = "1.9.0"
# Queued edits of a password-protected section are sealed under a key derived from its own.
aes-gcm = "0.11.1"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
getrandom = "0.4.3"
hmac = "0.13.0"
# OneNote packages (.onepkg) are cabinet files.
cab = "0.6"
# std's clock where there is one; the browser's on wasm32-unknown-unknown, whose std has none.
web-time = "1.1"

# The browser: its randomness, clock, timers and event loop, and SQLite's files kept with
# the notebooks' (`fs`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
rsqlite-vfs = "0.1.1"

[target.'cfg(target_vendor = "apple")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
libc = "0.2"
serde_json = "1"
tempfile = "3"

[[example]]
name = "smb_offline_client"
required-features = ["smb"]

[[example]]
name = "smb_reconnect_client"
required-features = ["smb"]

[[example]]
name = "smb_concurrent_client"
required-features = ["smb"]

[[example]]
name = "smb_publish_probe"
required-features = ["smb"]
