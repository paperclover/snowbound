[package]
name = "notebook"
version = "0.1.0"
edition = "2024"
publish = false

[features]
smb = ["dep:smb2", "dep:tokio"]
protected = ["onestore/protected", "dep:zeroize"]

[dependencies]
onestore = { path = "../onestore" }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.11"
smb2 = { version = "=0.21.0", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time"], optional = true }
zeroize = { version = "1.9.0", optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs"] }

[dev-dependencies]
libc = "0.2"
serde_json = "1"
tempfile = "3"

[[example]]
name = "smb_offline_client"
required-features = ["smb"]

[[example]]
name = "smb_reconnect_client"
required-features = ["smb"]

[[example]]
name = "smb_concurrent_client"
required-features = ["smb"]

[[example]]
name = "smb_publish_probe"
required-features = ["smb"]
