[package]
name = "onestore-offline"
version = "0.1.0"
edition = "2024"
publish = false

[features]
smb = ["dep:onestore-smb"]

[dependencies]
onestore = { path = "../onestore" }
onestore-smb = { path = "../onestore-smb", optional = true }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[[example]]
name = "smb_offline_client"
required-features = ["smb"]
