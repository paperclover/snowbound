[package]
name = "onestore"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
md5 = "0.8.1"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs"] }

[dev-dependencies]
serde_json = "1.0.151"
