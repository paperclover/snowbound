[package]
name = "onestore"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22.1"
bumpalo = "3.20.3"
serde_json = "1.0.151"
md5 = "0.8.1"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
aes = { version = "0.9.3", features = ["zeroize"] }
cbc = { version = "0.2.1", features = ["zeroize"] }
roxmltree = "0.21.1"
sha1 = { version = "0.11.0", features = ["zeroize"] }
subtle = "2.6.1"
zeroize = "1.9.0"
# std's clock where there is one; the browser's on wasm32-unknown-unknown, whose std has none.
web-time = "1.1"

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs"] }

# OneNote's byte-range locks on a section, which std's whole-file locks would overlap.
[target.'cfg(windows)'.dependencies]
file-guard = "0.2.0"

[dev-dependencies]
