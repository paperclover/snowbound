[package]
name = "onestore"
version = "0.1.0"
edition = "2024"
publish = false

[features]
protected = ["dep:aes", "dep:cbc", "dep:roxmltree", "dep:sha1", "dep:subtle", "dep:zeroize"]

[dependencies]
base64 = "0.22.1"
bumpalo = "3.20.3"
serde_json = "1.0.151"
md5 = "0.8.1"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
aes = { version = "0.9.3", features = ["zeroize"], optional = true }
cbc = { version = "0.2.1", features = ["zeroize"], optional = true }
roxmltree = { version = "0.21.1", optional = true }
sha1 = { version = "0.11.0", features = ["zeroize"], optional = true }
subtle = { version = "2.6.1", optional = true }
zeroize = { version = "1.9.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs"] }

[dev-dependencies]
