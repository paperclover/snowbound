[package]
name = "snowbound"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["wgpu"]
# Paints through wgpu; without it through OpenGL 2.1, for Mac OS X 10.6.
wgpu = ["draw/wgpu", "dep:wgpu"]

[dependencies]
canvas = { path = "../canvas", features = ["interaction", "pdf"] }
draw = { path = "../draw", default-features = false, features = ["render"] }
ui = { path = "../ui" }
png = "0.18"
# Encodes a video recording's pictures as JPEG, which OneNote 2010 plays.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
onestore = { path = "../onestore" }
notebook = { path = "../notebook" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = "0.4"
wgpu = { workspace = true, optional = true }
parley.workspace = true
winit = "0.30.13"
accesskit = "0.25.0"
accesskit_consumer = "0.39.0"
# Clears passwords typed into the password dialogs.
zeroize = "1.9.0"
# Names characters in More Symbols, Insert Symbol's dialog.
unicode_names2 = "4.0.0"
# std's clock where there is one; the browser's on wasm32-unknown-unknown, whose std has none.
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notebook = { path = "../notebook", features = ["smb"] }
accesskit_winit = { version = "0.34.0", default-features = false, features = ["rwh_06"] }
# Updates: fetched over HTTPS, verified with ed25519 and SHA-256. The browser updates by
# reloading.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
ring = "0.17"

# The browser: see arc/platforms.md.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgl"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
# Checks spelling with Hunspell dictionaries, as the browser offers pages no checker.
spellbook = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Document", "Element", "HtmlCanvasElement", "MediaQueryList", "Navigator", "Window"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", default-features = false, features = ["NSAlert", "NSButton", "NSCell", "NSControl", "NSView", "NSResponder", "NSWindow", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSColor", "NSColorSpace", "NSDatePicker", "NSDatePickerCell", "NSOpenPanel", "NSPanel", "NSSavePanel", "NSWorkspace"] }
objc2-foundation = { version = "0.2.2", default-features = false, features = ["NSString", "NSThread", "NSAttributedString", "NSDate", "NSCalendar", "NSDateFormatter", "NSGeometry", "NSLocale", "NSPathUtilities", "NSTimeZone", "NSURL", "NSArray", "NSRange", "NSError", "NSFileCoordinator", "NSFilePresenter", "NSFileVersion", "NSFileManager", "NSNotification", "NSOperation", "block2"] }
block2 = "0.5.1"

[target.'cfg(not(any(target_os = "macos", target_arch = "wasm32")))'.dependencies]
# macOS reads and writes the pasteboard itself.
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
accesskit_winit = { version = "0.34.0", default-features = false, features = ["accesskit_unix", "async-io"] }
smithay-clipboard = "0.7.3"
# Loads fontconfig at run time, so builds need no fontconfig headers or library.
fontique = { workspace = true, features = ["fontconfig-dlopen"] }
libc = "0.2"
# Names Rust functions in the crash log.
rustc-demangle = "0.1"
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
# The colours of winit's own window frame, which the toolbar continues.
sctk-adwaita = { version = "0.10.1", default-features = false }
# Sets the window's icon through xdg-toplevel-icon on winit's own Wayland connection.
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
