[package]
name = "onestore-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
onestore = { path = "../crates/onestore" }
notebook = { path = "../crates/notebook", features = ["live"] }
canvas = { path = "../crates/canvas" }
draw = { path = "../crates/draw", default-features = false }
tempfile = "3"
md5 = "0.8.1"
serde_json = "1"
minicbor = { version = "2.3.0", features = ["alloc"] }

[[bin]]
name = "clipboard"
path = "fuzz_targets/clipboard.rs"
test = false
doc = false
bench = false

