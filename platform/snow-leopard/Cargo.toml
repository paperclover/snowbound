# Mac OS X 10.6 work, built with cargo.sh. Its own workspace so the 10.6 target
# never enters the main workspace's builds.
[workspace]
members = ["hello", "probe", "reference"]
resolver = "3"

[workspace.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false }

[profile.dev.package."*"]
opt-level = 3
