[package]
name = "probe"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
draw = { path = "../../../crates/draw", default-features = false, features = ["render"] }
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["std", "NSString", "NSObject", "NSZone"] }
objc2-app-kit = { workspace = true, features = ["std", "NSOpenGL"] }
png = "0.18"
ui = { path = "../../../crates/ui" }

[[bin]]
name = "probe"
path = "src/main.rs"

[[bin]]
name = "render-probe"
path = "src/render.rs"

[[bin]]
name = "text-probe"
path = "src/text.rs"
