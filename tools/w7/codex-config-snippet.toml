# Paste into your MCP client's configuration (for Codex: ~/.codex/config.toml),
# replacing REPO with the absolute path of this repository. Settings come from
# REPO/.env (see .env.example).
[mcp_servers.win7]
command = "python3"
args = ["REPO/tools/w7/mcp_win7.py"]
# Covers a contended multi-VM boot with wait enabled.
tool_timeout_sec = 915

[mcp_servers.one-linux]
command = "python3"
args = ["REPO/tools/w7/mcp_linux.py"]
# A first boot downloads packages through cloud-init.
tool_timeout_sec = 915
